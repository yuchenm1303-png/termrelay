# Smirel Google / GitHub login provider template
# Copy the relevant values into the runtime/system settings used by this deployment.
# Keep client_secret server-side only. Never expose it to the frontend.

# GitHub OAuth App
github_oauth:
  enabled: false
  client_id: ""
  client_secret: ""
  authorize_url: "https://github.com/login/oauth/authorize"
  token_url: "https://github.com/login/oauth/access_token"
  userinfo_url: "https://api.github.com/user"
  emails_url: "https://api.github.com/user/emails"
  scopes: "read:user user:email"
  # Register this exact callback in the GitHub OAuth App.
  redirect_url: "https://YOUR_DOMAIN/api/v1/auth/oauth/github/callback"
  # Existing Smirel frontend callback page.
  frontend_redirect_url: "/auth/oauth/callback"

# Google OAuth 2.0 Web application
google_oauth:
  enabled: false
  client_id: ""
  client_secret: ""
  authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
  token_url: "https://oauth2.googleapis.com/token"
  userinfo_url: "https://openidconnect.googleapis.com/v1/userinfo"
  scopes: "openid email profile"
  # Register this exact callback in Google Cloud Console.
  redirect_url: "https://YOUR_DOMAIN/api/v1/auth/oauth/google/callback"
  # Existing Smirel frontend callback page.
  frontend_redirect_url: "/auth/oauth/callback"
