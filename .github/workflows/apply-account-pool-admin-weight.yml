name: Apply account pool admin weight API

on:
  push:
    branches:
      - chatgpt/account-pool-scheduler
    paths:
      - .github/workflows/apply-account-pool-admin-weight.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/account-pool-scheduler
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Apply and format patch
        run: |
          git apply --check .github/patches/account-pool-admin-weight-api.patch
          git apply .github/patches/account-pool-admin-weight-api.patch
          gofmt -w \
            backend/internal/handler/admin/account_handler.go \
            backend/internal/handler/dto/account_mapper_redact_test.go \
            backend/internal/handler/dto/mappers.go \
            backend/internal/handler/dto/types.go \
            backend/internal/service/account_pool_policy.go \
            backend/internal/service/account_pool_policy_test.go \
            backend/internal/service/admin_account.go \
            backend/internal/service/admin_service.go \
            backend/internal/service/admin_service_bulk_update_test.go
          git diff --check
      - name: Test scheduler and admin API
        working-directory: backend
        run: |
          go test ./internal/service ./internal/handler/dto ./internal/handler/admin
          go test -tags=unit ./internal/service -run 'TestAdminService(CreateAccount_AppliesSchedulingWeight|BulkUpdateAccounts_(AppliesSchedulingWeightAsExtraPatch|RejectsInvalidSchedulingWeight))'
      - name: Commit integration
        run: |
          rm .github/patches/account-pool-admin-weight-api.patch
          rm .github/workflows/apply-account-pool-admin-weight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(accounts): expose scheduling weight in admin API"
          git push origin HEAD:chatgpt/account-pool-scheduler
