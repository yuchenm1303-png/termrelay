name: Production Control

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-control-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify TermRelay production image source
        run: /bin/sh deploy/tests/termrelay-production-source-test.sh
      - name: Validate GitHub-driven production deploy script
        run: /bin/bash -n deploy/termrelay-auto-deploy.sh
