name: Sync account pool branch base

on:
  push:
    branches:
      - chatgpt/account-pool-scheduler
    paths:
      - .github/workflows/sync-account-pool-base.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/account-pool-scheduler
          fetch-depth: 0
      - name: Merge latest custom-ui safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin custom-ui
          git merge --no-commit --no-ff origin/custom-ui
          rm .github/workflows/sync-account-pool-base.yml
          git add -A
          git commit -m "merge: sync latest custom-ui into account pool scheduler"
          git push origin HEAD:chatgpt/account-pool-scheduler
