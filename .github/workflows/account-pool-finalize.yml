name: Finalize account pool hardening

on:
  push:
    branches:
      - chatgpt/account-pool-scheduler
    paths:
      - .github/workflows/account-pool-finalize.yml

permissions:
  contents: write

jobs:
  finalize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/account-pool-scheduler
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Apply final account pool patch
        run: |
          git apply --check .github/patches/account-pool-provider-admin-api.patch
          git apply .github/patches/account-pool-provider-admin-api.patch
          changed_go="$(git diff --name-only --diff-filter=ACM | grep '\.go$' || true)"
          if [ -n "$changed_go" ]; then
            gofmt -w $changed_go
          fi
          git diff --check
      - name: Test account pool and gateway integration
        working-directory: backend
        run: |
          go test ./internal/service ./internal/handler/dto ./internal/handler/admin
          go test -tags=unit ./internal/service -run 'AccountPool|ProviderIdentity|PreserveAccountPool|AdminServiceCreateAccount_AppliesProviderID|AdminServiceBulkUpdateAccounts_AppliesProviderIDAsExtraPatch'
          go test ./internal/handler ./cmd/server
      - name: Commit final integration
        run: |
          rm .github/workflows/account-pool-finalize.yml
          rm -f .github/patches/account-pool-provider-admin-api.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(accounts): finish provider-neutral account pool hardening'
          git push origin HEAD:chatgpt/account-pool-scheduler
