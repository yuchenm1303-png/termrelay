name: Smirel UI Preview

on:
  push:
    branches:
      - release/smirel-ui-next
    paths:
      - 'frontend/**'
      - '.github/workflows/smirel-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smirel-ui-preview-pages
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Smirel preview contract
        run: >-
          pnpm exec vitest run
          src/components/layout/__tests__/smirelWorkspaceNavigation.spec.ts
          src/components/layout/__tests__/LegacyUiCleanup.spec.ts
          src/components/layout/__tests__/siteLogoSanitization.spec.ts
          src/router/__tests__/guards.spec.ts
          src/router/__tests__/title.spec.ts

      - name: Build GitHub Pages preview
        run: pnpm build
        env:
          VITE_STANDALONE: 'true'
          VITE_SMIREL_STANDALONE: 'true'
          VITE_PUBLIC_BASE: '/termrelay/'
          VITE_API_BASE_URL: 'https://api.smirel.com/api/v1'

      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  regression-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full frontend regression report
        run: pnpm test:run
