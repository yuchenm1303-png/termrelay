name: Finalize account pool websocket credential feedback

on:
  push:
    branches:
      - chatgpt/account-pool-provider-feedback

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - name: Patch websocket credential outcome
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/internal/handler/openai_gateway_handler.go')
          s = p.read_text()
          old = '''\t\ttoken, _, err := h.gatewayService.GetRequestCredential(ctx, c, account)\n\t\tif err != nil {\n\t\t\treqLog.Warn("openai.websocket_get_access_token_failed", zap.Int64("account_id", account.ID), zap.Error(err))\n'''
          new = '''\t\ttoken, _, err := h.gatewayService.GetRequestCredential(ctx, c, account)\n\t\tif err != nil {\n\t\t\th.reportAccountPoolAttempt(account, nil, err)\n\t\t\treqLog.Warn("openai.websocket_get_access_token_failed", zap.Int64("account_id", account.ID), zap.Error(err))\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one websocket credential error block, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Format and static checks
        working-directory: backend
        run: |
          gofmt -w internal/handler/openai_gateway_handler.go
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('internal/handler/openai_gateway_handler.go').read_text()
          needle = '''token, _, err := h.gatewayService.GetRequestCredential(ctx, c, account)\n\t\tif err != nil {\n\t\t\th.reportAccountPoolAttempt(account, nil, err)'''
          if needle not in s:
              raise SystemExit('websocket credential failure is not wired to Account Pool outcome')
          PY
      - name: Account Pool focused tests
        working-directory: backend
        run: go test ./internal/service -run 'Test(AccountPool|GatewayAccountPool|ClassifyAccountPool|BuildOpenAIWeightedSelectionOrder|OpenAIAccountScheduler)' -count=1
      - name: Handler and server compile tests
        working-directory: backend
        run: |
          go test ./internal/handler -run '^$' -count=1
          go test ./cmd/server -run '^$' -count=1
      - name: Full Go test suite
        working-directory: backend
        run: go test ./... -count=1
      - name: Commit validated websocket credential fix
        shell: bash
        run: |
          git rm .github/workflows/account-pool-ws-credential-finalize.yml
          git add backend/internal/handler/openai_gateway_handler.go
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(scheduler): release websocket probe on credential failure'
          git push origin HEAD:chatgpt/account-pool-provider-feedback
