name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Only the newest commit for a branch/PR is useful. Cancel stale runs immediately
# so a burst of UI commits does not queue minutes of obsolete backend tests.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect affected areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              # Run the expensive TS/lint/vitest suite only when executable
              # frontend code/config changes. CSS, images and other static
              # assets are validated by the atomic production Vite build.
              - 'frontend/**/*.vue'
              - 'frontend/**/*.ts'
              - 'frontend/**/*.tsx'
              - 'frontend/**/*.js'
              - 'frontend/**/*.mjs'
              - 'frontend/**/*.cjs'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/tsconfig*.json'
              - 'frontend/vite.config.*'
              - 'frontend/eslint.config.*'
              - 'Makefile'
              - '.github/workflows/backend-ci.yml'
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/backend-ci.yml'
            deploy:
              - 'deploy/**'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - '.dockerignore'
              - '.github/workflows/backend-ci.yml'

  shell:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash -n deploy/backup-postgres.sh
          /bin/bash -n deploy/verify-postgres-backup.sh
          /bin/bash -n deploy/recovery-preflight.sh
          /bin/bash -n deploy/restore-postgres.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/tests/recovery-safety-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  # Keep the historical "test" check name for compatibility, but run only the
  # unit suite here. Integration tests run in parallel in the next job.
  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          actual="$(go env GOVERSION)"
          actual="${actual#go}"
          test -n "$expected"
          test "$actual" = "$expected"
      - name: Unit tests
        working-directory: backend
        run: make test-unit

  integration-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          actual="$(go env GOVERSION)"
          actual="${actual#go}"
          test -n "$expected"
          test "$actual" = "$expected"
      - name: Generate Ent client
        working-directory: backend
        run: go generate ./ent
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
