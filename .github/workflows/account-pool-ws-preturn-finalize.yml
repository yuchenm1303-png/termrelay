name: Finalize account pool websocket pre-turn feedback

on:
  push:
    branches:
      - chatgpt/account-pool-provider-feedback

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - name: Wire websocket pre-turn outcome
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/internal/handler/openai_gateway_handler.go')
          s = p.read_text()

          # Initial half-open reservation becomes pending as soon as admission succeeds.
          old = '''\t\tif !h.beginAccountPoolAttempt(account) {\n\t\t\tif accountReleaseFunc != nil {\n\t\t\t\taccountReleaseFunc()\n\t\t\t}\n\t\t\tfailedAccountIDs[account.ID] = struct{}{}\n\t\t\treqLog.Debug("openai.websocket_account_pool_circuit_skipped", zap.Int64("account_id", account.ID))\n\t\t\tcontinue\n\t\t}\n\t\tcurrentAccountRelease = wrapReleaseOnDone(ctx, accountReleaseFunc)\n'''
          new = '''\t\tif !h.beginAccountPoolAttempt(account) {\n\t\t\tif accountReleaseFunc != nil {\n\t\t\t\taccountReleaseFunc()\n\t\t\t}\n\t\t\tfailedAccountIDs[account.ID] = struct{}{}\n\t\t\treqLog.Debug("openai.websocket_account_pool_circuit_skipped", zap.Int64("account_id", account.ID))\n\t\t\tcontinue\n\t\t}\n\t\tvar accountPoolAttemptPending atomic.Bool\n\t\taccountPoolAttemptPending.Store(true)\n\t\tcurrentAccountRelease = wrapReleaseOnDone(ctx, accountReleaseFunc)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one initial websocket admission block, got {s.count(old)}')
          s = s.replace(old, new, 1)

          # Credential failure is the terminal outcome for the initial reserved probe.
          old = '''\t\ttoken, _, err := h.gatewayService.GetRequestCredential(ctx, c, account)\n\t\tif err != nil {\n\t\t\th.reportAccountPoolAttempt(account, nil, err)\n'''
          new = '''\t\ttoken, _, err := h.gatewayService.GetRequestCredential(ctx, c, account)\n\t\tif err != nil {\n\t\t\tif accountPoolAttemptPending.Swap(false) {\n\t\t\t\th.reportAccountPoolAttempt(account, nil, err)\n\t\t\t}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one websocket credential feedback block, got {s.count(old)}')
          s = s.replace(old, new, 1)

          # Every subsequent admitted turn owns a new pending half-open reservation.
          old = '''\t\t\t\tif !h.beginAccountPoolAttempt(account) {\n\t\t\t\t\tif accountReleaseFunc != nil {\n\t\t\t\t\t\taccountReleaseFunc()\n\t\t\t\t\t}\n\t\t\t\t\tif userReleaseFunc != nil {\n\t\t\t\t\t\tuserReleaseFunc()\n\t\t\t\t\t}\n\t\t\t\t\treturn service.NewOpenAIWSClientCloseError(coderws.StatusTryAgainLater, "account temporarily unavailable", nil)\n\t\t\t\t}\n\t\t\t\tcurrentUserRelease = wrapReleaseOnDone(ctx, userReleaseFunc)\n'''
          new = '''\t\t\t\tif !h.beginAccountPoolAttempt(account) {\n\t\t\t\t\tif accountReleaseFunc != nil {\n\t\t\t\t\t\taccountReleaseFunc()\n\t\t\t\t\t}\n\t\t\t\t\tif userReleaseFunc != nil {\n\t\t\t\t\t\tuserReleaseFunc()\n\t\t\t\t\t}\n\t\t\t\t\treturn service.NewOpenAIWSClientCloseError(coderws.StatusTryAgainLater, "account temporarily unavailable", nil)\n\t\t\t\t}\n\t\t\t\taccountPoolAttemptPending.Store(true)\n\t\t\t\tcurrentUserRelease = wrapReleaseOnDone(ctx, userReleaseFunc)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one subsequent websocket admission block, got {s.count(old)}')
          s = s.replace(old, new, 1)

          # AfterTurn consumes the reservation exactly once; this prevents the outer
          # Proxy return path from double-reporting the same upstream outcome.
          old = '''\t\t\tAfterTurn: func(turn int, result *service.OpenAIForwardResult, turnErr error) {\n\t\t\t\tif turnErr != nil || result != nil {\n\t\t\t\t\th.reportAccountPoolAttempt(account, result, turnErr)\n\t\t\t\t}\n'''
          new = '''\t\t\tAfterTurn: func(turn int, result *service.OpenAIForwardResult, turnErr error) {\n\t\t\t\tif (turnErr != nil || result != nil) && accountPoolAttemptPending.Swap(false) {\n\t\t\t\t\th.reportAccountPoolAttempt(account, result, turnErr)\n\t\t\t\t}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one websocket AfterTurn feedback block, got {s.count(old)}')
          s = s.replace(old, new, 1)

          # If Proxy exits before AfterTurn (dial/handshake/preflight failure), feed
          # the actual error to the same provider-neutral classifier. A clean client
          # close with a still-pending reservation abandons it without health penalty.
          old = '''\t\tproxyErr := h.gatewayService.ProxyResponsesWebSocketFromClient(ctx, c, wsConn, account, token, wsFirstMessage, hooks)\n\t\t// Release a possible half-open reservation if the proxy exits before\n\t\t// any turn emitted an account-attributable outcome. No-op after Report.\n\t\th.abandonAccountPoolAttempt(account)\n\t\tif proxyErr != nil {\n'''
          new = '''\t\tproxyErr := h.gatewayService.ProxyResponsesWebSocketFromClient(ctx, c, wsConn, account, token, wsFirstMessage, hooks)\n\t\tif accountPoolAttemptPending.Swap(false) {\n\t\t\tif proxyErr != nil {\n\t\t\t\th.reportAccountPoolAttempt(account, nil, proxyErr)\n\t\t\t} else {\n\t\t\t\th.abandonAccountPoolAttempt(account)\n\t\t\t}\n\t\t}\n\t\tif proxyErr != nil {\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one websocket proxy cleanup block, got {s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Format and semantic static checks
        working-directory: backend
        run: |
          gofmt -w internal/handler/openai_gateway_handler.go
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('internal/handler/openai_gateway_handler.go').read_text()
          start = s.index('func (h *OpenAIGatewayHandler) ResponsesWebSocket(c *gin.Context)')
          ws = s[start:]
          checks = {
              'pending declaration': 'var accountPoolAttemptPending atomic.Bool',
              'initial pending': 'accountPoolAttemptPending.Store(true)',
              'credential consume': 'if accountPoolAttemptPending.Swap(false) {\n\t\t\t\th.reportAccountPoolAttempt(account, nil, err)',
              'AfterTurn consume': '&& accountPoolAttemptPending.Swap(false)',
              'pre-turn proxy error report': 'h.reportAccountPoolAttempt(account, nil, proxyErr)',
              'clean abandon': 'h.abandonAccountPoolAttempt(account)',
          }
          for name, needle in checks.items():
              if needle not in ws:
                  raise SystemExit(f'missing {name}')
          if ws.count('var accountPoolAttemptPending atomic.Bool') != 1:
              raise SystemExit('websocket pending tracker must be declared exactly once')
          PY
      - name: Account Pool focused tests
        working-directory: backend
        run: go test ./internal/service -run 'Test(AccountPool|GatewayAccountPool|ClassifyAccountPool|BuildOpenAIWeightedSelectionOrder|OpenAIAccountScheduler)' -count=1
      - name: Handler and server compile tests
        working-directory: backend
        run: |
          go test ./internal/handler -run '^$' -count=1
          go test ./cmd/server -run '^$' -count=1
      - name: Full Go test suite
        working-directory: backend
        run: go test ./... -count=1
      - name: Commit validated websocket pre-turn feedback fix
        shell: bash
        run: |
          git rm .github/workflows/account-pool-ws-preturn-finalize.yml
          git add backend/internal/handler/openai_gateway_handler.go
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(scheduler): report websocket pre-turn failures'
          git push origin HEAD:chatgpt/account-pool-provider-feedback
