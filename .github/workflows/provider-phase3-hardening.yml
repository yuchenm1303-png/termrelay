name: Provider Phase3 Hardening

on:
  push:
    branches:
      - feat/provider-adapter-phase3

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Apply provider phase3 semantic hardening
        run: python3 tools/provider_phase3_hardening.py
      - name: Format changed Go files
        run: |
          gofmt -w \
            backend/internal/service/provider_adapter.go \
            backend/internal/service/provider_adapter_capabilities.go \
            backend/internal/service/gemini_provider_request.go \
            backend/internal/service/gemini_provider_request_test.go \
            backend/internal/service/gemini_messages_compat_service.go
      - name: Focused provider and Gemini tests
        working-directory: backend
        run: go test ./internal/service -run 'TestGeminiGatewayProviderAdapter|TestGeminiForwardAsChatCompletions|TestGeminiMessagesCompatServiceForward|TestProviderAdapter|TestProviderRegistry|TestGeminiResourceExhaustedNormalization' -count=1
      - name: Commit hardened provider refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/internal/service/provider_adapter.go \
                  backend/internal/service/provider_adapter_capabilities.go \
                  backend/internal/service/gemini_provider_request.go \
                  backend/internal/service/gemini_provider_request_test.go \
                  backend/internal/service/gemini_messages_compat_service.go
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix(provider): preserve Gemini retry and OAuth routing semantics'
          git push origin HEAD:feat/provider-adapter-phase3
