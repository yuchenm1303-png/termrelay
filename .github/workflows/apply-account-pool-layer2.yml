name: Apply account pool layer2 patch

on:
  push:
    branches:
      - chatgpt/account-pool-scheduler
    paths:
      - .github/patches/account-pool-layer2.patch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/account-pool-scheduler
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git apply --check .github/patches/account-pool-layer2.patch
          git apply .github/patches/account-pool-layer2.patch
          rm .github/patches/account-pool-layer2.patch
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(scheduler): wire account pool into gateway layer 2"
          git push origin HEAD:chatgpt/account-pool-scheduler
