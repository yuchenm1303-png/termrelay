name: Sync account pool snapshot metadata

on:
  push:
    branches:
      - tmp/account-pool-snapshot-sync-20260908

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/account-pool-scheduler
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Preserve account pool metadata in scheduler snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path('backend/internal/repository/scheduler_cache.go')
          text = cache.read_text()
          old = '''\t\t"quota_reset_timezone",\n\t\t"mixed_scheduling",\n\t\t"window_cost_limit",'''
          new = '''\t\t"quota_reset_timezone",\n\t\t"mixed_scheduling",\n\t\t"provider_id",\n\t\t"scheduling_weight",\n\t\t"window_cost_limit",'''
          if new not in text:
              if old not in text:
                  raise SystemExit('scheduler extra anchor not found')
              text = text.replace(old, new, 1)
              cache.write_text(text)

          test = Path('backend/internal/repository/scheduler_cache_test.go')
          test_text = test.read_text()
          marker = 'func TestSchedulerMetadataAccountKeepsAccountPoolRoutingMetadata'
          if marker not in test_text:
              test_text = test_text.rstrip() + '''\n\nfunc TestSchedulerMetadataAccountKeepsAccountPoolRoutingMetadata(t *testing.T) {\n\taccount := service.Account{\n\t\tID: 77,\n\t\tExtra: map[string]any{\n\t\t\t"provider_id":       "llmgw",\n\t\t\t"scheduling_weight": 6.5,\n\t\t\t"api_key":           "must-not-leak",\n\t\t\t"unrelated":         "drop-me",\n\t\t},\n\t}\n\n\tmetadata := buildSchedulerMetadataAccount(account)\n\n\trequire.Equal(t, "llmgw", metadata.Extra["provider_id"])\n\trequire.Equal(t, 6.5, metadata.Extra["scheduling_weight"])\n\trequire.NotContains(t, metadata.Extra, "api_key")\n\trequire.NotContains(t, metadata.Extra, "unrelated")\n}\n'''
              test.write_text(test_text)
          PY
          gofmt -w backend/internal/repository/scheduler_cache.go backend/internal/repository/scheduler_cache_test.go
          git diff --check

      - name: Test scheduler snapshot metadata
        working-directory: backend
        run: |
          go test ./internal/repository
          go test -tags=unit ./internal/service -run 'AccountPool|ProviderIdentity|PreserveAccountPool|AdminServiceCreateAccount_AppliesProviderID|AdminServiceBulkUpdateAccounts_AppliesProviderIDAsExtraPatch'

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/internal/repository/scheduler_cache.go backend/internal/repository/scheduler_cache_test.go
          git commit -m 'fix(scheduler): preserve account pool metadata in snapshots'
          git push origin HEAD:chatgpt/account-pool-scheduler
