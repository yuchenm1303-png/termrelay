name: Finalize OpenAI account pool admission placement

on:
  push:
    branches:
      - chatgpt/account-pool-provider-feedback

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - name: Fix OpenAI admission placement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/internal/handler/openai_gateway_handler.go')
          s = p.read_text()

          wrong = '''\n\t\tif !h.beginAccountPoolAttempt(account) {\n\t\t\tif accountReleaseFunc != nil {\n\t\t\t\taccountReleaseFunc()\n\t\t\t}\n\t\t\tfailedAccountIDs[account.ID] = struct{}{}\n\t\t\treqLog.Debug("openai_messages.account_pool_circuit_skipped", zap.Int64("account_id", account.ID))\n\t\t\tcontinue\n\t\t}\n'''
          if s.count(wrong) != 1:
              raise SystemExit(f'expected one misplaced Messages admission block, got {s.count(wrong)}')
          s = s.replace(wrong, '', 1)

          anchor = '''\t\taccountReleaseFunc, acquired := h.acquireResponsesAccountSlot(c, apiKey.GroupID, sessionHash, selection, reqStream, &streamStarted, reqLog)\n\t\tif !acquired {\n\t\t\treturn\n\t\t}\n\n\t\tservice.SetOpsLatencyMs(c, service.OpsRoutingLatencyMsKey, time.Since(routingStart).Milliseconds())\n\t\tforwardStart := time.Now()\n\n\t\tdefaultMappedModel := strings.TrimSpace(effectiveMappedModel)\n'''
          replacement = '''\t\taccountReleaseFunc, acquired := h.acquireResponsesAccountSlot(c, apiKey.GroupID, sessionHash, selection, reqStream, &streamStarted, reqLog)\n\t\tif !acquired {\n\t\t\treturn\n\t\t}\n\n\t\tif !h.beginAccountPoolAttempt(account) {\n\t\t\tif accountReleaseFunc != nil {\n\t\t\t\taccountReleaseFunc()\n\t\t\t}\n\t\t\tfailedAccountIDs[account.ID] = struct{}{}\n\t\t\treqLog.Debug("openai_messages.account_pool_circuit_skipped", zap.Int64("account_id", account.ID))\n\t\t\tcontinue\n\t\t}\n\n\t\tservice.SetOpsLatencyMs(c, service.OpsRoutingLatencyMsKey, time.Since(routingStart).Milliseconds())\n\t\tforwardStart := time.Now()\n\n\t\tdefaultMappedModel := strings.TrimSpace(effectiveMappedModel)\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected exactly one Messages acquire anchor, got {s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
      - name: Format and semantic static checks
        working-directory: backend
        run: |
          gofmt -w internal/handler/openai_gateway_handler.go
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('internal/handler/openai_gateway_handler.go').read_text()
          start = s.index('func (h *OpenAIGatewayHandler) Responses(c *gin.Context)')
          end = s.index('func (h *OpenAIGatewayHandler) Messages(c *gin.Context)')
          responses = s[start:end]
          start2 = end
          end2 = s.index('func (h *OpenAIGatewayHandler) ResponsesWebSocket(c *gin.Context)')
          messages = s[start2:end2]
          if responses.count('if !h.beginAccountPoolAttempt(account)') != 1:
              raise SystemExit(f'Responses admission count={responses.count("if !h.beginAccountPoolAttempt(account)")}, want 1')
          if messages.count('if !h.beginAccountPoolAttempt(account)') != 1:
              raise SystemExit(f'Messages admission count={messages.count("if !h.beginAccountPoolAttempt(account)")}, want 1')
          if 'openai.account_pool_circuit_skipped' not in responses:
              raise SystemExit('Responses admission marker missing')
          if 'openai_messages.account_pool_circuit_skipped' not in messages:
              raise SystemExit('Messages admission marker missing')
          PY
      - name: Account Pool focused tests
        working-directory: backend
        run: go test ./internal/service -run 'Test(AccountPool|GatewayAccountPool|ClassifyAccountPool|BuildOpenAIWeightedSelectionOrder|OpenAIAccountScheduler)' -count=1
      - name: Handler and server compile tests
        working-directory: backend
        run: |
          go test ./internal/handler -run '^$' -count=1
          go test ./cmd/server -run '^$' -count=1
      - name: Full Go test suite
        working-directory: backend
        run: go test ./... -count=1
      - name: Commit validated admission placement fix
        shell: bash
        run: |
          git rm .github/workflows/account-pool-openai-admission-finalize.yml
          git add backend/internal/handler/openai_gateway_handler.go
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(scheduler): place OpenAI pool admission once per path'
          git push origin HEAD:chatgpt/account-pool-provider-feedback
