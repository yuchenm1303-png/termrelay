name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  pull-requests: read

# Security scans for superseded commits add no release value. Keep scheduled
# weekly scans separate so a push cannot cancel the maintenance scan.
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect affected areas
        id: filter
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/security-scan.yml'
            frontend:
              # pnpm audit is dependency-based, so ordinary Vue/CSS edits do
              # not need to reinstall and rescan the same dependency graph.
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - '.github/audit-exceptions.yml'
              - 'tools/check_pnpm_audit_exceptions.py'
              - '.github/workflows/security-scan.yml'
      - name: Decide scan scope
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${FILTER_BACKEND:-false}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FILTER_FRONTEND:-false}" >> "$GITHUB_OUTPUT"
          fi

  backend-security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          actual="$(go env GOVERSION)"
          actual="${actual#go}"
          test -n "$expected"
          test "$actual" = "$expected"
      - name: Generate Ent client
        working-directory: backend
        run: go generate ./ent
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-security:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py             --audit frontend/audit.json             --exceptions .github/audit-exceptions.yml
