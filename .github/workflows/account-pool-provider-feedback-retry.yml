name: Retry account pool provider feedback

on:
  push:
    branches:
      - chatgpt/account-pool-provider-feedback

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum
      - name: Reuse finalized patch script
        shell: bash
        run: |
          python3 <<'BOOT'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/account-pool-provider-feedback-finalize.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace("test.write_text(r'''package service", "test.write_text('''package service")
          Path('/tmp/apply_account_pool_feedback.py').write_text(script)
          BOOT
          python3 /tmp/apply_account_pool_feedback.py

      - name: Format and static checks
        working-directory: backend
        run: |
          gofmt -w internal/service/gateway_account_pool_scheduler.go \
            internal/service/account_pool_provider_feedback_integration_test.go \
            internal/service/gemini_messages_compat_service.go \
            internal/service/gemini_chat_completions_compat_service.go \
            internal/handler/gateway_handler.go \
            internal/handler/gateway_handler_chat_completions.go \
            internal/handler/gateway_handler_responses.go \
            internal/handler/gemini_v1beta_handler.go \
            internal/handler/openai_gateway_handler.go \
            internal/handler/openai_chat_completions.go \
            internal/handler/openai_embeddings.go \
            internal/handler/openai_alpha_search.go \
            internal/handler/openai_images.go \
            internal/handler/grok_media.go \
            internal/handler/wire.go \
            cmd/server/wire_gen.go
          git diff --check
          test "$(grep -c 'return nil, &UpstreamFailoverError{StatusCode: http.StatusBadGateway}' internal/service/gemini_messages_compat_service.go)" -ge 2
          test "$(grep -c 'return nil, &UpstreamFailoverError{StatusCode: http.StatusBadGateway}' internal/service/gemini_chat_completions_compat_service.go)" -ge 1

      - name: Account Pool focused tests
        working-directory: backend
        run: go test ./internal/service -run 'Test(AccountPool|GatewayAccountPool|ClassifyAccountPool|BuildOpenAIWeightedSelectionOrder|OpenAIAccountScheduler)' -count=1

      - name: Provider integration service tests
        working-directory: backend
        run: go test ./internal/service -run 'Test(GeminiMessagesCompatSignatureRetry|GeminiProvider|ProviderAdapter)' -count=1

      - name: Handler and server compile tests
        working-directory: backend
        run: |
          go test ./internal/handler -run '^$' -count=1
          go test ./cmd/server -run '^$' -count=1

      - name: Full Go test suite
        working-directory: backend
        run: go test ./... -count=1

      - name: Commit validated follow-up
        shell: bash
        run: |
          git rm .github/workflows/account-pool-provider-feedback-finalize.yml \
            .github/workflows/account-pool-provider-feedback-retry.yml
          git add backend
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(scheduler): unify provider account pool feedback'
          git push origin HEAD:chatgpt/account-pool-provider-feedback
