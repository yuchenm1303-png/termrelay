name: Apply OpenAI account weight patch

on:
  push:
    branches:
      - chatgpt/account-pool-scheduler
    paths:
      - .github/workflows/apply-openai-account-weight.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/account-pool-scheduler
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git apply --check .github/patches/openai-account-static-weight.patch
          git apply .github/patches/openai-account-static-weight.patch
          rm .github/patches/openai-account-static-weight.patch
          rm .github/workflows/apply-openai-account-weight.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(scheduler): honor account traffic weight in OpenAI pool"
          git push origin HEAD:chatgpt/account-pool-scheduler
